<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        
        <title>Baloncesto</title>
    </head>
    <body class="bg-dark d-flex flex-column align-items-center justify-content-center min-vh-100">
        <h2 class="titulo text-white mb-4">🏀 El Arte del Baloncesto</h2>

        <div id="carruselBasket" class="carousel slide carousel-fade carrusel-custom" data-bs-ride="carousel" data-bs-interval="3500">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carruselBasket" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carruselBasket" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carruselBasket" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#carruselBasket" data-bs-slide-to="3"></button>
                <button type="button" data-bs-target="#carruselBasket" data-bs-slide-to="4"></button>
            </div>

            <div class="carousel-inner rounded-4 overflow-hidden">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=900&h=500&fit=crop" class="d-block w-100 imagen-carrusel" alt="Partido de baloncesto">
                    <div class="carousel-caption caption-custom">
                        <h5>La cesta</h5>
                        <p>El objetivo de cada jugada.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1504450758481-7338eba7524a?w=900&h=500&fit=crop" class="d-block w-100 imagen-carrusel" alt="Estadio de baloncesto">
                    <div class="carousel-caption caption-custom">
                        <h5>El estadio</h5>
                        <p>Donde la multitud cobra vida.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1574623452334-1e0ac2b3ccb4?w=900&h=500&fit=crop" class="d-block w-100 imagen-carrusel" alt="Varios balones">
                    <div class="carousel-caption caption-custom">
                        <h5>Los balones</h5>
                        <p>Listos para el siguiente entrenamiento.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1519861531473-9200262188bf?w=900&h=500&fit=crop" class="d-block w-100 imagen-carrusel" alt="Balón de baloncesto">
                    <div class="carousel-caption caption-custom">
                        <h5>El balón</h5>
                        <p>Que siempre te acompaña.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1608245449230-4ac19066d2d0?w=900&h=500&fit=crop" class="d-block w-100 imagen-carrusel" alt="Mate de baloncesto">
                    <div class="carousel-caption caption-custom">
                        <h5>El mate</h5>
                        <p>Fuerza, altura y dominio total.</p>
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carruselBasket" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carruselBasket" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
