<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Github Login</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="d-flex flex-column align-items-center min-vh-100 py-4">

        <i class="bi bi-github github-logo my-3"></i>

        <p class="title mb-3">Sign in to GitHub</p>

        <main class="w-100 d-flex flex-column gap-3">
            <form action="" class="form p-4 rounded">
                <div class="user mb-3">
                    <label for="username" class="form-label fw-bold" id="user-title">Username or email address</label>
                    <input type="text" id="username" class="form-control custom-input">
                </div>

                <div class="pass mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label fw-bold mb-0" id="pass-title">Password</label>
                        <a id="pass-forgot" href="#" class="small fw-bold">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="form-control custom-input">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn submit-btn fw-semibold">Sign in</button>
                </div>
            </form>

            <div class="sign-in d-flex flex-row justify-content-center align-items-center p-3 rounded">
                <p class="text-1 mb-0">New to GitHub?</p>
                <a class="text-2 ms-1" href="#">Create an account</a>
                <p class="text-1 mb-0">.</p>
            </div>
        </main>

        <footer class="footer d-flex justify-content-center gap-4 py-3 mt-5 w-100">
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
            <a href="#">Security</a>
            <a href="#" class="contact">Contact GitHub</a>
        </footer>

    </body>
</html>
