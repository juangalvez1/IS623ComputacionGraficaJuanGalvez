<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="style.css">
        <title>Github Login</title>
    </head>
    <body>
        <img src="media/Orion_github.svg" alt="github-logo.png" class="github-logo">

        <p class="title">Sign in to GitHub</p>

        <main>
            <form action="" class="form">
                <div class="user">
                    <label id="user-title">Username or email address</label>
                    <input type="text" id="data">
                </div>

                <div class="pass">
                    <label id="pass-title">Password</label>
                    <a id="pass-forgot" href="#">Forgot password?</a>
                    <input type="text" id="data">
                </div>

                <div class="input">
                    <input type="submit" value="Sign in" class="submit">
                </div>
            </form>

            <div class="sign-in">
                <p class="text-1">New to GitHub?</p>
                <a class="text-2" href="#"> Create an account</a>
                <p class="text-1">.</p>
            </div>
        </main>

        <footer class="footer">
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
            <a href="#">Security</a>
            <a href="#" class="contact">Contact GitHub</a>
        </footer>

    </body>
</html>
